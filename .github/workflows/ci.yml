name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  changes:
    runs-on: ${{ vars.CI_LINUX_RUNNER == 'box' && fromJSON('["self-hosted","linux","x64","sidenote-box"]') || 'ubuntu-slim' }}
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.paths.outputs.linux }}
      windows: ${{ steps.paths.outputs.windows }}
      relay: ${{ steps.paths.outputs.relay }}
      tools: ${{ steps.paths.outputs.tools }}
      module: ${{ steps.paths.outputs.module }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          HOSTED_WINDOWS: ${{ vars.HOSTED_WINDOWS }}
        run: |
          python3 -I .github/ci_changes.py --self-test
          python3 -I .github/ci_changes.py

  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ${{ vars.CI_LINUX_RUNNER == 'box' && fromJSON('["self-hosted","linux","x64","sidenote-box"]') || 'ubuntu-24.04' }}
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Linux process and filesystem boundaries
        run: python -I tools/prove_linux_boundaries.py . --self-test
      - name: Install native build dependencies
        if: vars.CI_LINUX_RUNNER != 'box'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        id: rust
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Select box Cargo cache
        if: vars.CI_LINUX_RUNNER == 'box'
        env:
          CACHE_KEY: ${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
        run: |
          python3 -I - <<'PY'
          import os, re, shutil
          from pathlib import Path

          cache = Path("/home/boxes/gh-runner/cache").resolve(strict=True)
          key = re.compile(r"[0-9a-f]{12}-[0-9a-f]{64}")
          name = os.environ["CACHE_KEY"]
          assert key.fullmatch(name), name
          selected = cache / name
          selected.mkdir(exist_ok=True)
          assert not selected.is_symlink()
          selected.touch()
          entries = sorted((p for p in cache.iterdir() if key.fullmatch(p.name)
                            and not p.is_symlink() and p.is_dir()),
                           key=lambda p: p.stat().st_mtime, reverse=True)
          for old in entries[2:]:
              shutil.rmtree(old)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print(f"CARGO_HOME={selected / 'cargo'}", file=env)
              print(f"CARGO_TARGET_DIR={selected / 'target'}", file=env)
          PY
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: vars.CI_LINUX_RUNNER != 'box'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86_64-unknown-linux-gnu
            target/debug
          key: ci-ubuntu-24.04-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
          restore-keys: ci-ubuntu-24.04-${{ steps.rust.outputs.cachekey }}-
      - name: Clippy on default and ASR test targets
        run: |
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo clippy --workspace --locked --all-targets --features asr-runtime -- -D warnings
      - name: Test default and ASR feature sets
        env:
          TEST_MODULE: ${{ needs.changes.outputs.module }}
        shell: bash
        run: |
          umask 077
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root"/{state,meetings,peers,cache,data,xdg-state,public-test-key}
          export TMPDIR="$root" SIDENOTE_DATA_DIR="$root/state" SIDENOTE_HEX_DIR="$root/meetings"
          export SIDENOTE_PEERS_DIR="$root/peers" XDG_DATA_HOME="$root/data" XDG_CACHE_HOME="$root/cache"
          export XDG_STATE_HOME="$root/xdg-state" CREDENTIALS_DIRECTORY="$root/public-test-key"
          unset DISPLAY WAYLAND_DISPLAY XDG_CONFIG_HOME
          python3 -I -c 'import os; from pathlib import Path; (Path(os.environ["CREDENTIALS_DIRECTORY"]) / "sidenote-key").write_bytes(bytes(range(32)))'
          skip=(--skip tree_worker::tests::packaged_service_admits_ordinary_helpers
                --skip packaged_speech_service_admits_only_speech
                --skip service::speech::proofs::service_shutdown_replans_and_replays_over_http
                --skip service::speech::proofs::speech_service_fixture)
          if [[ -n "$TEST_MODULE" ]]; then
            cargo test --locked -p sidenote --lib "$TEST_MODULE"
            cargo test --locked -p sidenote --lib --features asr-runtime "$TEST_MODULE"
          else
            cargo test --locked --workspace --no-fail-fast -- "${skip[@]}"
            cargo test --locked --workspace --no-fail-fast --features asr-runtime -- "${skip[@]}" --skip server_role_exposes_only_scoped_host_probe
          fi

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ${{ vars.CI_LINUX_RUNNER == 'box' && fromJSON('["self-hosted","linux","x64","sidenote-box"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - working-directory: relay
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test tests

  tools:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ${{ vars.CI_LINUX_RUNNER == 'box' && fromJSON('["self-hosted","linux","x64","sidenote-box"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.changes.outputs.linux == 'false'
        run: python -I tools/prove_linux_boundaries.py . --self-test
      - run: python -I tools/pipeline-tests.py
      - shell: pwsh
        run: ./tools/dependency_notices_proof.ps1

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        id: rust
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-toolchain
          path-type: inherit
      - name: Add GNU tools to PATH
        shell: pwsh
        run: '"${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86_64-pc-windows-gnu
            target/debug
          key: ci-windows-gnu-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
          restore-keys: ci-windows-gnu-${{ steps.rust.outputs.cachekey }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Install Wrangler for headless Windows integration tests
        working-directory: relay
        run: bun install --frozen-lockfile
      - name: Compile both test feature sets
        shell: bash
        run: |
          cargo check --workspace --locked --tests
          cargo check --workspace --locked --tests --features asr-runtime
      - name: Test Windows-specific behavior
        shell: bash
        run: |
          export SIDENOTE_DATA_DIR=$(cygpath -w "$RUNNER_TEMP/sidenote-ci")
          cargo test --locked --features asr-runtime -p sidenote --lib -- \
            platform::windows::tests:: updates::implementation:: hex_install:: meeting_icon:: \
            core::daily_check::background_tests:: core::meeting_evidence::speech_host_tests:: \
            core::meeting_router::jobs::handoff::tests:: core::meeting_router::jobs::r1_tests:: \
            core::meeting_router::production::gap_tests:: core::meeting_router::production::http_tests:: \
            core::meeting_router::production::no_speech_tests:: core::meeting_router::production::probe_tests:: \
            core::meeting_router::production::round2_tests:: core::meeting_router::revision::captured_tests:: \
            core::meeting_router::revision::receipts:: provisioning_review_load_uses_the_resolved_path \
            automatic_runtime_comes_from_the_package_and_explicit_path_wins \
            dev40_setup_required_keeps_the_capture_and_shows_the_count \
            core::relay_preview::migration::security_tests:: \
            --skip meeting_icon_capture_affinity_updates_live_windows
          cargo test --locked --features asr-runtime -p sidenote --bin sidenote -- \
            install_hooks_tests:: ui::models::dev40_ ui::models::provisioning_review_
          cargo test --locked --features asr-runtime -p sidenote --test idle_cpu --test relay_preview

  gate:
    name: CI Gate
    if: always()
    needs: [changes, linux, relay, tools, windows]
    runs-on: ${{ vars.CI_LINUX_RUNNER == 'box' && fromJSON('["self-hosted","linux","x64","sidenote-box"]') || 'ubuntu-slim' }}
    timeout-minutes: 5
    steps:
      - name: Verify required job results
        env:
          CHANGES: ${{ needs.changes.result }}
          HOSTED_WINDOWS: ${{ vars.HOSTED_WINDOWS }}
          LINUX: ${{ needs.linux.result }}/${{ needs.changes.outputs.linux }}
          WINDOWS: ${{ needs.windows.result }}/${{ needs.changes.outputs.windows }}
          RELAY: ${{ needs.relay.result }}/${{ needs.changes.outputs.relay }}
          TOOLS: ${{ needs.tools.result }}/${{ needs.changes.outputs.tools }}
        shell: bash
        run: |
          [[ "$CHANGES" == success ]] || { echo "changes: expected success, got $CHANGES"; exit 1; }
          if [[ "$HOSTED_WINDOWS" != on ]]; then echo "Windows skipped: hosted Windows off"; fi
          failed=0
          for job in LINUX WINDOWS RELAY TOOLS; do
            case "${!job}" in
              success/true|skipped/false) ;;
              *) echo "$job: unexpected result/required flag ${!job}"; failed=1 ;;
            esac
          done
          exit "$failed"
