name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy
      - uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-toolchain
          path-type: inherit
      - name: Add GNU tools to PATH
        shell: pwsh
        run: '"${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Install Bun for local relay tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP bun.zip
          $folder = Join-Path $env:RUNNER_TEMP bun
          Invoke-WebRequest https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-windows-x64.zip -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          "$folder/bun-windows-x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install and test local relay dependencies
        working-directory: relay
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun test tests
          exit $LASTEXITCODE
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-gnu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
      - run: cargo fmt --all --check
      - name: Verify reproducible dependency notices
        run: powershell.exe -NoProfile -NonInteractive -File tools/dependency_notices_proof.ps1
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
