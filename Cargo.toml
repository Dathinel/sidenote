[workspace]
members = ["crates/meetings-domain"]
default-members = [".", "crates/meetings-domain"]
resolver = "3"

[package]
name = "sidenote"
version = "0.0.1-dev.9"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.11"
url = "2"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"], optional = true }
kaldi-fbank = { version = "=0.1.0", optional = true }
hound = "3.5"
blake3 = "1"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std"] }
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "dx12", "vulkan"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "a138b97e654b8299b2a4cb518b8476b2b528c2c4", default-features = false, features = ["accessibility"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a138b97e654b8299b2a4cb518b8476b2b528c2c4", optional = true, features = ["markdown"] }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "a138b97e654b8299b2a4cb518b8476b2b528c2c4", optional = true }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "a138b97e654b8299b2a4cb518b8476b2b528c2c4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }
velopack = "=0.0.1298"

[features]
asr-runtime = ["dep:ort", "dep:kaldi-fbank"]
default = ["ui-kit"]
ui-kit = ["dep:rune-kit", "dep:rune-motion", "dep:rune-theme-opencode"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[dev-dependencies]
pollster = "1"
